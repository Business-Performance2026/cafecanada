<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cafeoman">
<meta name="theme-color" content="#6B4226">
<script src="pwa-install.js" defer></script>

<title>Inscrivez votre café</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap" style="max-width:420px; padding-top:50px;">
  <div class="shop-name display" style="text-align:center; margin-bottom:8px;">Inscrivez votre café</div>
  <p style="text-align:center; color:var(--stone); font-size:0.85rem; margin-bottom:24px;">
    Créez votre compte et préparez votre menu numérique en quelques minutes.
  </p>

  <div class="card">
    <div class="field">
      <label for="signupEmail">Courriel <span style="color:#B3441E;">*</span></label>
      <input type="email" id="signupEmail" placeholder="you@example.com">
    </div>

    <div class="field">
      <label for="signupPassword">Mot de passe</label>
      <input type="password" id="signupPassword" placeholder="6 caractères minimum">
    </div>

    <div class="field">
      <label for="signupPasswordConfirm">Confirmer le mot de passe</label>
      <input type="password" id="signupPasswordConfirm" placeholder="Retapez le mot de passe">
    </div>

    <div class="field">
      <label for="signupWhatsapp">Numéro WhatsApp <span style="color:#B3441E;">*</span></label>
      <div style="display:flex; gap:8px;">
        <span style="padding:10px 14px; background:var(--paper-dim); border:1px solid var(--line); border-radius:var(--radius); font-weight:600; flex-shrink:0;">+968</span>
        <input type="tel" id="signupWhatsapp" placeholder="9xxxxxxx" style="flex:1;">
      </div>
    </div>

    <button class="btn" style="width:100%;" onclick="signup()">Créer le compte</button>
    <div id="error" class="error-msg"></div>

    <div style="text-align:center; margin-top:16px; font-size:0.85rem; color:var(--stone);">
      Vous avez déjà un compte ? <a href="login.html" style="color:var(--accent);">Connectez-vous</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
async function signup() {
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';

  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
  const localNumber = document.getElementById('signupWhatsapp').value.trim().replace(/[\s-]/g, '');
  const whatsapp = localNumber ? '+968' + localNumber : '';

  if (!email) {
    errorEl.textContent = "Le courriel est obligatoire.";
    return;
  }
  if (!localNumber) {
    errorEl.textContent = "Le numéro WhatsApp est obligatoire.";
    return;
  }
  if (!/^[0-9]{7,9}$/.test(localNumber)) {
    errorEl.textContent = "Numéro WhatsApp invalide. Entrez votre numéro sans l'indicatif du pays.";
    return;
  }
  if (!password || !passwordConfirm) {
    errorEl.textContent = "Veuillez entrer et confirmer le mot de passe.";
    return;
  }
  if (password.length < 6) {
    errorEl.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
    return;
  }
  if (password !== passwordConfirm) {
    errorEl.textContent = "Les mots de passe ne correspondent pas.";
    return;
  }

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;

    // Create the shop's Firestore document. Status starts as "pending" until
    // the owner verifies their email — at that point the dashboard automatically
    // activates a 7-day free trial. After the trial ends, an admin needs to
    // confirm payment and extend the subscription end date.
    await db.collection('shops').doc(uid).set({
      info: {
        name: '',
        whatsapp,
        email,
        subscriptionStatus: 'pending',
        selfSignup: true
      }
    });

    await cred.user.sendEmailVerification();

    document.querySelector('.card').innerHTML = `
      <div style="text-align:center; padding:20px 10px;">
        <div style="font-size:2.5rem; margin-bottom:10px;">📧</div>
        <h3 style="margin-bottom:10px;">Vérifiez votre courriel</h3>
        <p style="color:var(--stone); font-size:0.9rem;">
          Nous avons envoyé un lien de confirmation à <strong>${email}</strong>.<br>
          Après avoir cliqué sur le lien, connectez-vous : votre essai gratuit de 14 jours s'activera automatiquement.
        </p>
        <p style="color:#B3441E; font-size:0.85rem; margin-top:10px;">
          📩 Si le courriel n'arrive pas dans votre boîte de réception d'ici une minute, vérifiez vos courriels indésirables (spam).
        </p>
        <a href="login.html" class="btn" style="display:inline-block; margin-top:16px; text-decoration:none;">Se connecter</a>
      </div>
    `;
  } catch (err) {
    console.error(err);
    if (err.code === 'auth/email-already-in-use') {
      errorEl.textContent = "Ce courriel est déjà utilisé. Essayez plutôt de vous connecter.";
    } else if (err.code === 'auth/invalid-email') {
      errorEl.textContent = "Format de courriel invalide.";
    } else {
      errorEl.textContent = "Une erreur s'est produite lors de la création du compte. Veuillez réessayer.";
    }
  }
}

document.getElementById('signupPasswordConfirm').addEventListener('keydown', e => {
  if (e.key === 'Enter') signup();
});
</script>

</body>
</html>
