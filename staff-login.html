<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cafeoman">
<meta name="theme-color" content="#6B4226">
<script src="pwa-install.js" defer></script>

<title>دخول الموظفين</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="loadingMsg" class="state-msg">جاري التحقق من تسجيل الدخول...</div>

<div class="wrap" id="loginForm" style="max-width:400px; padding-top:60px; display:none;">
  <div class="shop-name display" style="text-align:center; margin-bottom:30px;">دخول الموظفين</div>

  <div class="card">
    <div class="field">
      <label for="staffEmail">البريد الإلكتروني</label>
      <input type="email" id="staffEmail" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="staffPassword">كلمة المرور</label>
      <div style="display:flex; gap:6px;">
        <input type="password" id="staffPassword" placeholder="••••••••" style="flex:1;">
        <button type="button" onclick="toggleStaffPwVisibility()" class="btn btn-ghost" style="padding:8px 12px;">👁️</button>
      </div>
    </div>
    <button class="btn" style="width:100%;" onclick="staffLogin()">دخول</button>
    <div id="error" class="error-msg"></div>
    <div id="successMsg" style="color:#3D6B4F; font-size:0.85rem; margin-top:8px;"></div>

    <div style="text-align:center; margin-top:16px; font-size:0.85rem;">
      <a href="#" onclick="forgotStaffPassword(); return false;" style="color:var(--accent);">نسيت كلمة المرور؟</a>
    </div>
    <div style="text-align:center; margin-top:10px; font-size:0.85rem; color:var(--stone);">
      صاحب الكوفي؟ <a href="login.html" style="color:var(--accent);">سجل دخولك من هنا</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
window.addEventListener('pageshow', function (event) {
  if (event.persisted) {
    window.location.reload();
  }
});

// Opens the connection to Firestore early, same reasoning as login.html.
db.collection('categoryIcons').limit(1).get().catch(() => {});

// If already logged in, go straight to dashboard (dashboard.html detects
// automatically whether this is an owner or a staff account). Otherwise,
// NOW reveal the login form — kept hidden until this point so a quick
// bounce-through after "back" navigation never flashes the form.
auth.onAuthStateChanged(user => {
  if (user) {
    window.location.href = 'dashboard.html';
    return;
  }
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
});

function toggleStaffPwVisibility() {
  const input = document.getElementById('staffPassword');
  input.type = input.type === 'password' ? 'text' : 'password';
}

function staffLogin() {
  const email = document.getElementById('staffEmail').value.trim();
  const password = document.getElementById('staffPassword').value;
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';

  if (!email || !password) {
    errorEl.textContent = 'الرجاء إدخال البريد الإلكتروني وكلمة المرور.';
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .then(() => { window.location.href = 'dashboard.html'; })
    .catch(err => {
      console.error(err);
      errorEl.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
    });
}

document.getElementById('staffPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') staffLogin();
});

function forgotStaffPassword() {
  const email = document.getElementById('staffEmail').value.trim();
  const errorEl = document.getElementById('error');
  const successEl = document.getElementById('successMsg');
  errorEl.textContent = '';
  successEl.textContent = '';

  if (!email) {
    errorEl.textContent = 'اكتب بريدك الإلكتروني بالخانة فوق أولاً، وبعدين اضغط "نسيت كلمة المرور".';
    return;
  }

  auth.sendPasswordResetEmail(email)
    .then(() => {
      successEl.textContent = 'تم إرسال رابط إعادة تعيين كلمة المرور لبريدك الإلكتروني ✓';
    })
    .catch(err => {
      console.error(err);
      errorEl.textContent = 'تعذر إرسال رابط إعادة التعيين. تأكد من صحة البريد الإلكتروني.';
    });
}
</script>

</body>
</html>
