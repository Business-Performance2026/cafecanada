function t(key) {
  return (translations[key] && translations[key][currentLang]) || key;
}

function toggleLang() {
  currentLang = currentLang === 'fr' ? 'en' : 'fr';
  localStorage.setItem('menuLang', currentLang);
  applyLangDirection();
  loadMenu();
}

function applyLangDirection() {
  document.documentElement.lang = currentLang;
  document.documentElement.dir = 'ltr';
  document.getElementById('langToggle').textContent = currentLang === 'fr' ? 'EN' : 'FR';
  document.getElementById('langToggle').style.display = 'block';
}

async function showGiftViewPage(giftId) {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="state-msg">${t('loadingMenu')}</div>`;

  const giftDoc = await db.collection('shops').doc(shopId).collection('giftCards').doc(giftId).get();

  if (!giftDoc.exists) {
    app.innerHTML = `<div class="state-msg">${t('giftNotFound')}</div>`;
    return;
  }

  const gift = giftDoc.data();
  const shopName = (currentLang === 'en' && shopInfo.nameEn) ? shopInfo.nameEn : (shopInfo.name || '');
  const itemsHtml = (gift.items || []).map(i => {
    const iName = (currentLang === 'en' && i.nameEn) ? i.nameEn : i.name;
    return `<div style="display:flex; justify-content:space-between; padding:6px 0; font-size:0.95rem;"><span>${iName}</span><span style="color:var(--stone);">×${i.qty}</span></div>`;
  }).join('');

  app.innerHTML = `
    <div class="wrap" style="padding-top:50px; text-align:center;">
      <div id="giftBoxWrap" onclick="openGiftBox()" style="cursor:pointer;">
        <div id="giftBoxEmoji" class="gift-box-pulse" style="font-size:5rem; margin-bottom:10px;">🎁</div>
        <p style="color:var(--stone); margin-bottom:4px;">${shopName}</p>
        <p id="giftTapHint" style="font-weight:600;">${t('tapToOpenGift')}</p>
      </div>
      <div id="giftContentsWrap" style="display:none;">
        <h2 style="margin-bottom:4px;">${t('giftBoxTitle')}</h2>
        <p style="color:var(--stone); margin-bottom:24px;">${shopName}</p>
        <div class="card" style="text-align:left;">
          ${gift.personalMessage ? `<p style="font-style:italic; color:var(--ink); margin-bottom:16px; padding-bottom:16px; border-bottom:1px dashed var(--line);">"${gift.personalMessage}"</p>` : ''}
          <div style="font-weight:700; margin-bottom:8px;">${t('giftContentsLbl')}</div>
          ${itemsHtml}
          <div style="text-align:center; font-weight:700; color:#3D7A47; margin-top:16px; padding-top:12px; border-top:1px solid var(--line); font-size:1.1rem;">🎉 ${t('giftFreeLabel')}</div>
          <div id="giftClaimArea" style="margin-top:20px;"></div>
        </div>
      </div>
    </div>
  `;

  // The claim button/area is built once and slotted in when the box opens,
  // keeping this exactly the same as before — just revealed after the tap.
  const claimAreaHtml = gift.redeemed
    ? `<div style="color:#B3441E; font-weight:700;">✓ ${t('giftAlreadyClaimed')}</div>`
    : `<button class="btn" id="claimGiftBtn" style="width:100%;" onclick="claimGift('${giftId}')">✅ ${t('claimGiftBtn')}</button>
       <p style="font-size:0.78rem; color:var(--stone); margin-top:8px;">${t('claimGiftHint')}</p>`;
  document.getElementById('giftClaimArea').innerHTML = claimAreaHtml;
}

function openGiftBox() {
  const boxWrap = document.getElementById('giftBoxWrap');
  const emoji = document.getElementById('giftBoxEmoji');
  const contentsWrap = document.getElementById('giftContentsWrap');
  if (!boxWrap || boxWrap.style.pointerEvents === 'none') return;

  boxWrap.style.pointerEvents = 'none';
  emoji.classList.remove('gift-box-pulse');
  emoji.classList.add('gift-box-opening');
  document.getElementById('giftTapHint').style.opacity = '0';

  setTimeout(() => {
    boxWrap.style.display = 'none';
    contentsWrap.style.display = 'block';
    contentsWrap.classList.add('gift-contents-reveal');
  }, 550);
}

async function claimGift(giftId) {
  const btn = document.getElementById('claimGiftBtn');
  const claimArea = document.getElementById('giftClaimArea');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = t('redeemingGift');

  const giftRef = db.collection('shops').doc(shopId).collection('giftCards').doc(giftId);
  const orderRef = db.collection('shops').doc(shopId).collection('orders').doc();

  try {
    await db.runTransaction(async (tx) => {
      const freshGift = await tx.get(giftRef);
      if (!freshGift.exists || freshGift.data().redeemed) {
        throw new Error('ALREADY_REDEEMED');
      }
      const g = freshGift.data();

      tx.update(giftRef, { redeemed: true, redeemedAt: firebase.firestore.FieldValue.serverTimestamp() });

      tx.set(orderRef, {
        orderType: 'table',
        tableNumber: null,
        carNumber: null,
        carColor: null,
        notes: `${t('giftOrderNote')}: ${g.recipientName || ''}`,
        paymentMethod: 'transfer',
        isGiftOrder: true,
        receiptUrl: g.receiptUrl || null,
        loyaltyPhone: null,
        loyaltyRewardReady: false,
        items: g.items,
        total: g.total,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    claimArea.innerHTML = `<div style="color:#3D7A47; font-weight:700;">✅ ${t('giftClaimedSuccess')}</div>`;
  } catch (err) {
    console.error('Gift claim failed:', err);
    claimArea.innerHTML = `<div style="color:#B3441E; font-weight:700;">✓ ${t('giftAlreadyClaimed')}</div>`;
  }
}

async function loadMenu() {
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  shopId = params.get('shop');
  app.innerHTML = `<div class="state-msg">${t('loadingMenu')}</div>`;

  if (!shopId) {
    app.innerHTML = `<div class="state-msg">${t('invalidLink')}</div>`;
    return;
  }

  try {
    const shopDoc = await db.collection('shops').doc(shopId).get();

    if (!shopDoc.exists) {
      app.innerHTML = `<div class="state-msg">${t('shopNotFound')}</div>`;
      return;
    }

    const shop = shopDoc.data();
    shopInfo = shop.info || {};

    const giftId = params.get('gift');
    if (giftId) {
      if (shopInfo.primaryColor) {
        document.documentElement.style.setProperty('--accent', shopInfo.primaryColor);
      }
      await showGiftViewPage(giftId);
      return;
    }

    const isManuallyActive = shopInfo.subscriptionStatus === 'active';
    const pastEndDate = shopInfo.subscriptionEndDate && new Date(shopInfo.subscriptionEndDate) < new Date(new Date().toDateString());
    const isEffectivelyActive = isManuallyActive && !pastEndDate;

    if (!isEffectivelyActive) {
      app.innerHTML = `<div class="state-msg">${t('menuUnavailable')}</div>`;
      return;
    }

    if (shopInfo.primaryColor) {
      document.documentElement.style.setProperty('--accent', shopInfo.primaryColor);
    }
    const shopName = (currentLang === 'en' && shopInfo.nameEn) ? shopInfo.nameEn : (shopInfo.name || 'Menu');
    document.title = shopName;

    const [menuSnap, roomsSnap] = await Promise.all([
      db.collection('shops').doc(shopId).collection('menu').orderBy('category').get(),
      db.collection('shops').doc(shopId).collection('rooms').get()
    ]);
    shopRooms = roomsSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    const categories = {};
    suggestedItemIds = [];
    menuSnap.forEach(doc => {
      const item = doc.data();
      if (item.hidden === true) return; // fully hidden from customers, skip entirely
      const catAr = item.category || (currentLang === 'en' ? 'Other' : 'Autre');
      const catDisplay = (currentLang === 'en' && item.categoryEn) ? item.categoryEn : catAr;
      if (!categories[catDisplay]) categories[catDisplay] = [];
      categories[catDisplay].push({ id: doc.id, ...item });
    });

    const coverStyle = shopInfo.coverImage ? `style="background-image:url('${shopInfo.coverImage}')"` : '';

    // Only worth asking upfront if there's an actual choice to make —
    // more than one order type, or a gift option alongside at least one type.
    const entryTypesEnabled = {
      table: (shopInfo.orderTypes ? shopInfo.orderTypes.table !== false : true),
      car: (shopInfo.orderTypes ? shopInfo.orderTypes.car !== false : true),
      delivery: (shopInfo.orderTypes ? shopInfo.orderTypes.delivery === true : false)
    };
    const entryGiftAvailable = shopInfo.paymentMethods && shopInfo.paymentMethods.transfer !== false;
    const entryTypeCount = Object.values(entryTypesEnabled).filter(Boolean).length;
    const showEntryChoice = entryTypeCount > 1 || (entryTypeCount >= 1 && entryGiftAvailable);

    pendingMenuCategories = categories;
    pendingMenuShopName = shopName;
    pendingEntryTypesEnabled = entryTypesEnabled;
    pendingEntryGiftAvailable = entryGiftAvailable;
    pendingCoverStyle = coverStyle;

    if (showEntryChoice) {
      history.replaceState({ menuView: 'entryChoice' }, '', '');
      renderEntryChoiceScreen(entryTypesEnabled, entryGiftAvailable, coverStyle);
      return;
    }

    // No real choice to make — same default behavior as before this feature existed.
    if (entryTypesEnabled.table) selectedOrderType = 'table';
    else if (entryTypesEnabled.car) selectedOrderType = 'car';
    else if (entryTypesEnabled.delivery) selectedOrderType = 'delivery';
    orderTypePreset = true;
    renderMenuGridAndHero(coverStyle);
    return;

  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="state-msg">${t('loadError')}<br><small style="color:#B3441E;">${err.code || ''} ${err.message || err}</small></div>`;
  }
}

// Shows the "Dine-in / Car Pickup / Send a Gift" choice screen, matching
// the reference design — this is the very first thing the customer sees
// after scanning the QR code (when there's an actual choice to make).
function renderEntryChoiceScreen(entryTypesEnabled, entryGiftAvailable, coverStyle) {
  const app = document.getElementById('app');
  const shopName = pendingMenuShopName;

  let optionsHtml = '';
  if (entryTypesEnabled.table) {
    optionsHtml += `
      <button type="button" class="entry-choice-btn" onclick="proceedToMenuAfterEntryChoice('table')">
        <span class="entry-choice-icon">🍽️</span>
        <span class="entry-choice-label">${t('orderFromTable')}</span>
        <span class="entry-choice-arrow">‹</span>
      </button>`;
  }
  if (entryTypesEnabled.car) {
    optionsHtml += `
      <button type="button" class="entry-choice-btn" onclick="proceedToMenuAfterEntryChoice('car')">
        <span class="entry-choice-icon">🚗</span>
        <span class="entry-choice-label">${t('orderFromCar')}</span>
        <span class="entry-choice-arrow">‹</span>
      </button>`;
  }
  if (entryTypesEnabled.delivery) {

// Builds the hero header + category pills + item grid — exactly the same
// markup and logic that used to run directly inside loadMenu(), just moved
// into its own function so it can run either immediately (shops with only
// one possible order type) or after the entry-choice screen.
function renderMenuGridAndHero(coverStyle) {
  const app = document.getElementById('app');
  const categories = pendingMenuCategories;
  const shopName = pendingMenuShopName;

  try {
    let html = `
      <div class="menu-hero" ${coverStyle}>
        ${shopInfo.logo ? `<img src="${shopInfo.logo}" class="menu-hero-logo" alt="${shopName}">` : ''}
        <div class="menu-hero-name display">${shopName}</div>
        ${(currentLang === 'en' && shopInfo.taglineEn) ? `<div class="menu-hero-tagline">${shopInfo.taglineEn}</div>` : (shopInfo.tagline ? `<div class="menu-hero-tagline">${shopInfo.tagline}</div>` : '')}
        ${shopInfo.location ? `<div class="menu-hero-location">${shopInfo.location}</div>` : ''}
        ${(shopInfo.showRatingPublicly && shopInfo.avgRating) ? `<div class="menu-hero-rating">⭐ ${shopInfo.avgRating} (${shopInfo.ratingCount} ${t('ratingsWord')})</div>` : ''}
        ${shopRooms.length > 0 ? `<button class="reserve-room-btn" onclick="openReserveModal()">🏛️ ${t('reserveRoomBtn')}</button>` : ''}
        ${shopInfo.openingHours ? `
          <div class="hours-toggle" onclick="toggleHours()">
            <span>🕐</span><span>${t('openingHoursLbl')}</span><span id="hoursArrow">⌄</span>
          </div>
          <div class="hours-content" id="hoursContent" style="display:none;">${shopInfo.openingHours}</div>
        ` : ''}
      </div>

      ${renderSocialIconsHtml()}

      <div class="menu-search-wrap">
        <input type="text" id="menuSearchInput" class="menu-search-input" placeholder="${t('searchPlaceholder')}" oninput="filterMenuSearch(this.value)">
      </div>
    `;

    const categoryNames = Object.keys(categories);

    if (categoryNames.length === 0) {
      html += `<div class="state-msg">${t('noItems')}</div>`;
    } else if (categoryNames.length > 1) {
      html += '<div class="category-pills" id="categoryPills">';
      categoryNames.forEach((cat, i) => {
        html += `<button class="pill ${i === 0 ? 'active' : ''}" data-cat="cat-${i}" onclick="scrollToCategory('cat-${i}', this)">${cat}</button>`;
      });
      html += '</div>';
    }

    categoryNames.forEach((category, i) => {
      const items = categories[category];
      html += `<div class="category-title" id="cat-${i}">${category}</div>`;
      html += '<div class="menu-grid">';
      items.forEach(item => {
        const unavailable = item.available === false || item.stock === 0;
        const itemName = (currentLang === 'en' && item.nameEn) ? item.nameEn : item.name;
        const itemDesc = item.description || '';
        itemMeta[item.id] = { name: item.name, nameEn: item.nameEn || '', price: item.price, image: item.image || '', description: itemDesc, available: item.available !== false && item.stock !== 0 };
        if (item.suggested === true && item.available !== false) suggestedItemIds.push(item.id);
        html += `
          <div class="grid-card ${unavailable ? 'unavailable' : ''}" data-search="${(itemName + ' ' + itemDesc).toLowerCase()}">
            <div class="grid-card-img-wrap" onclick="openItemDetail('${item.id}')">
              ${item.image ? `<img src="${item.image}" class="grid-card-img" alt="">` : ''}
              ${item.bestSeller ? `<div class="best-seller-badge">⭐ ${t('bestSellerTag')}</div>` : ''}
              ${unavailable ? `<div class="grid-unavailable-tag">${t('unavailableTag')}</div>` : `
                <div class="grid-qty-container" id="qtyctrl-${item.id}">${renderQtyControl(item.id, 0)}</div>
              `}
            </div>
            <div class="grid-card-body" onclick="openItemDetail('${item.id}')">
              <div class="grid-card-name">${itemName}</div>
              <div class="grid-card-price">${Number(item.price).toFixed(2)} ${t('currency')}</div>
            </div>
          </div>
        `;
      });
      html += '</div>';
    });

    app.innerHTML = html;

    // Resume tracking a previously placed order, if one is still active for this shop
    // (survives page refresh, since it's stored in the browser, not just in memory)
    const savedOrderId = localStorage.getItem(`activeOrder_${shopId}`);
    if (savedOrderId) {
      trackOrder(savedOrderId);
    }

  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="state-msg">${t('loadError')}<br><small style="color:#B3441E;">${err.code || ''} ${err.message || err}</small></div>`;
  }
}

function escapeStr(str) {
  return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function toggleHours() {
  const content = document.getElementById('hoursContent');
  const arrow = document.getElementById('hoursArrow');
  const isOpen = content.style.display === 'block';
  content.style.display = isOpen ? 'none' : 'block';
  arrow.textContent = isOpen ? '⌄' : '⌃';
}

function filterMenuSearch(query) {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('.grid-card').forEach(card => {
    const matches = !q || (card.dataset.search || '').includes(q);
    card.style.display = matches ? '' : 'none';
  });
  // Hide category titles/pills sections that end up with zero visible items
  document.querySelectorAll('.menu-grid').forEach(grid => {
    const anyVisible = Array.from(grid.children).some(c => c.style.display !== 'none');
    grid.style.display = anyVisible ? '' : 'none';
    const title = grid.previousElementSibling;
    if (title && title.classList.contains('category-title')) {
      title.style.display = anyVisible ? '' : 'none';
    }
  });
}

function scrollToCategory(catId, pillEl) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pillEl.classList.add('active');
  const target = document.getElementById(catId);
  const pillsBar = document.getElementById('categoryPills');
  const offset = pillsBar ? pillsBar.offsetHeight + 12 : 12;
  const top = target.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({ top, behavior: 'smooth' });
}

// ---- Cart logic ----
function renderQtyControl(itemId, qty) {
  if (qty <= 0) {
    return `<button class="grid-add-btn" onclick='event.stopPropagation(); changeQty("${itemId}", 1)'>+</button>`;
  }
  return `
    <div class="grid-qty-stepper" onclick="event.stopPropagation()">
      <button onclick='changeQty("${itemId}", -1)'>−</button>
      <span class="grid-qty-num">${qty}</span>
      <button onclick='changeQty("${itemId}", 1)'>+</button>
    </div>
  `;
}

function changeQty(itemId, delta) {
  const meta = itemMeta[itemId];
  if (!cart[itemId]) cart[itemId] = { name: meta.name, nameEn: meta.nameEn, price: meta.price, qty: 0 };
  cart[itemId].qty += delta;
  const newQty = cart[itemId].qty > 0 ? cart[itemId].qty : 0;
  if (cart[itemId].qty <= 0) delete cart[itemId];

  const container = document.getElementById(`qtyctrl-${itemId}`);
  if (container) container.innerHTML = renderQtyControl(itemId, newQty);

  updateCartBar();
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const items = Object.values(cart);
  const totalQty = items.reduce((sum, i) => sum + i.qty, 0);
  const totalPrice = items.reduce((sum, i) => sum + i.qty * i.price, 0);

  if (totalQty === 0) {
    bar.style.display = 'none';
    adjustStatusBarPosition();
    return;
  }

  bar.style.display = 'flex';
  document.getElementById('cartCount').textContent = `${totalQty} ${t('itemsWord')}`;
  document.getElementById('cartTotal').textContent = `${totalPrice.toFixed(2)} ${t('currency')}`;
  adjustStatusBarPosition();
}

// The cart bar and the order-tracking status bar both sit at the same
// fixed spot at the bottom of the screen. If a customer is already
// tracking one order and starts building a second, both bars would show
// at once and silently overlap — this lifts the status bar clear of the
// cart bar whenever both are visible, so neither is ever hidden behind
// the other.
function adjustStatusBarPosition() {
  const cartBarVisible = document.getElementById('cartBar').style.display === 'flex';
  const statusBar = document.getElementById('orderStatusBar');
  if (!statusBar) return;
  statusBar.style.bottom = cartBarVisible ? 'calc(86px + env(safe-area-inset-bottom))' : '';
}

function addSuggestedToCart(itemId) {
  changeQty(itemId, 1);
  closeCartModal();
  openCartModal();
}

async function submitReservation() {
  const errorEl = document.getElementById('reserveError');
  errorEl.textContent = '';

  const roomId = document.getElementById('resRoom').value;
  const date = document.getElementById('resDate').value;
  const time = document.getElementById('resTime').value;
  const guests = parseInt(document.getElementById('resGuests').value) || 1;
  const name = document.getElementById('resName').value.trim();
  const phone = document.getElementById('resPhone').value.trim();
  const notes = document.getElementById('resNotes').value.trim();

  if (!name || !phone) {
    errorEl.textContent = t('reserveNameRequired');
    return;
  }

  const room = shopRooms.find(r => r.id === roomId);
  const roomName = room ? room.name : '';
  const slotId = `${roomId}_${date}_${time}`;

  try {
    await db.runTransaction(async (tx) => {
      const slotRef = db.collection('shops').doc(shopId).collection('bookedSlots').doc(slotId);
      const slotDoc = await tx.get(slotRef);
      if (slotDoc.exists) {
        throw new Error('SLOT_TAKEN');
      }
      tx.set(slotRef, { roomId, date, time, createdAt: firebase.firestore.FieldValue.serverTimestamp() });

      const resRef = db.collection('shops').doc(shopId).collection('reservations').doc();
      tx.set(resRef, {
        roomId, roomName, date, time, guests, notes: notes || null,
        customerName: name, phone,
        status: 'confirmed',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    document.querySelector('#reserveOverlay .modal-sheet').innerHTML = `
      <div style="text-align:center; padding:20px 10px;">
        <div style="font-size:2.5rem; margin-bottom:10px;">✅</div>
        <h3>${t('reservationConfirmed')}</h3>
        <p style="color:var(--stone);">${roomName} — ${date} ${time}</p>
        <button class="btn" style="margin-top:16px;" onclick="document.getElementById('reserveOverlay').remove()">${t('close')}</button>
      </div>
    `;
  } catch (err) {
    if (err.message === 'SLOT_TAKEN') {
      errorEl.textContent = t('slotTakenError');
    } else {
      console.error(err);
      errorEl.textContent = t('orderSendError');
    }
  }
}

async function handleGiftReceiptUpload(input) {

  statusEl.textContent = t('uploadingReceipt');

  try {
    const path = `shops/${shopId}/receipts/${Date.now()}_${file.name}`;
    const ref = storage.ref().child(path);
    await ref.put(file);
    giftReceiptUrl = await ref.getDownloadURL();
    statusEl.style.color = '#3D6B4F';
    statusEl.textContent = t('receiptUploaded');
  } catch (err) {
    console.error('Gift receipt upload failed:', err);
    giftReceiptUrl = null;
    statusEl.style.color = '#B3441E';
    statusEl.textContent = t('receiptUploadFailed');
  }
}

async function submitGiftOrder() {
  const submitBtn = document.getElementById('submitGiftBtn');
  if (submitBtn.disabled) return;

  const errorEl = document.getElementById('giftError');
  const recipientName = document.getElementById('giftRecipientName').value.trim();
  const recipientPhoneDigits = document.getElementById('giftRecipientPhone').value.trim();
  const personalMessage = document.getElementById('giftPersonalMessage').value.trim();

  if (!recipientName || !recipientPhoneDigits) {
    errorEl.textContent = t('giftFieldsError');
    return;
  }
  if (!giftReceiptUrl) {
    errorEl.textContent = t('receiptRequiredError');
    return;
  }

  const items = Object.values(cart).map(i => ({ name: i.name, nameEn: i.nameEn || null, price: i.price, qty: i.qty }));
  const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);

  submitBtn.disabled = true;
  submitBtn.textContent = t('sendingOrderLoading');
  errorEl.textContent = '';

  try {
    const shortId = await generateUniqueShortGiftId();
    await db.collection('shops').doc(shopId).collection('giftCards').doc(shortId).set({
      items,
      total,
      recipientName,
      recipientPhone: `+968 ${recipientPhoneDigits}`,
      personalMessage: personalMessage || null,
      receiptUrl: giftReceiptUrl,
      redeemed: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    cart = {};
    updateCartBar();
    giftReceiptUrl = null;

    showGiftSentConfirmation(recipientName);
  } catch (err) {
    console.error('Gift order failed:', err);
    errorEl.textContent = t('orderSendError');
    submitBtn.disabled = false;
    submitBtn.textContent = `🎁 ${t('sendGiftBtn')}`;
  }
}

// Generates a short (7-character) random ID for a gift instead of
// Firestore's normal long auto-ID, for a much shorter shareable link.
// Checks for a collision before using it — the ID space (36^7, over 78
// billion combinations) makes a collision astronomically unlikely, but
// this guarantees it can never silently overwrite an existing gift.
async function generateUniqueShortGiftId() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  for (let attempt = 0; attempt < 5; attempt++) {
    let id = '';
    for (let i = 0; i < 7; i++) {
      id += chars[Math.floor(Math.random() * chars.length)];
    }
    const existing = await db.collection('shops').doc(shopId).collection('giftCards').doc(id).get();
    if (!existing.exists) return id;
  }
  // Extremely unlikely fallback: if 5 random attempts somehow all
  // collided, fall back to Firestore's own guaranteed-unique long ID
  // rather than failing the purchase.
  return db.collection('shops').doc(shopId).collection('giftCards').doc().id;
}

// Builds each cart-review line with a quantity stepper and a remove (×)
// button — used both when the modal first opens and whenever a line
// changes, so the review screen never needs a full re-open.
function buildCartLinesHtml(items) {
  return items.map(([id, i]) => {
    const dispName = (currentLang === 'en' && i.nameEn) ? i.nameEn : i.name;
    return `
      <div class="cart-line">
        <button type="button" class="cart-line-remove" onclick='removeCartLine("${id}")'>×</button>
        <span class="cart-line-name">${dispName}</span>
        <div class="cart-line-qty">
          <button type="button" onclick='cartLineChangeQty("${id}", -1)'>−</button>
          <span>${i.qty}</span>
          <button type="button" onclick='cartLineChangeQty("${id}", 1)'>+</button>
        </div>
        <span class="cart-line-price">${(i.qty * i.price).toFixed(2)} ${t('currency')}</span>
      </div>
    `;
  }).join('');
}

// Changing quantity or removing a line reuses changeQty() exactly as the
// main grid's +/- buttons do — same cart object, same grid-control sync,
// same cart-bar update — just followed by refreshing this modal's own display.
function cartLineChangeQty(itemId, delta) {
  changeQty(itemId, delta);
  refreshCartReviewDisplay();
}

function removeCartLine(itemId) {
  if (cart[itemId]) {
    changeQty(itemId, -cart[itemId].qty);
  }
  refreshCartReviewDisplay();
}

function refreshCartReviewDisplay() {
  const items = Object.entries(cart);
  if (items.length === 0) {
    closeCartModal();
    return;
  }
  const linesContainer = document.getElementById('cartLinesContainer');
  const totalLineEl = document.getElementById('cartTotalLine');
  if (linesContainer) linesContainer.innerHTML = buildCartLinesHtml(items);
  if (totalLineEl) {
    const total = items.reduce((sum, [, i]) => sum + i.qty * i.price, 0);
    totalLineEl.innerHTML = `<span>${t('total')}</span><span>${total.toFixed(2)} ${t('currency')}</span>`;
  }
}

let rewardPopupShownForPhone = null;

async function checkLoyaltyPoints() {
  const phoneInput = document.getElementById('loyaltyPhoneInput');
  const displayEl = document.getElementById('loyaltyPointsDisplay');
  if (!phoneInput || !displayEl) return;

  const phone = phoneInput.value.trim();
  currentLoyaltyRewardReady = false;
  if (!phone || phone.length < 7) {
    displayEl.textContent = '';
    return;
  }

  localStorage.setItem('loyaltyPhone_' + shopId, phone);
  const threshold = shopInfo.loyaltyThreshold || 6;

  try {
    const doc = await db.collection('shops').doc(shopId).collection('loyaltyCustomers').doc(phone).get();
    const points = doc.exists ? (doc.data().points || 0) : 0;

    if (points >= threshold) {
      currentLoyaltyRewardReady = true;
      displayEl.innerHTML = `🎉 <strong>${t('rewardReadyMsg')}</strong> ${shopInfo.loyaltyRewardText || ''}`;
      displayEl.style.color = '#3D7A47';
      if (rewardPopupShownForPhone !== phone) {
        rewardPopupShownForPhone = phone;
        showRewardReadyPopup();
      }
    } else {
      const remaining = threshold - points;
      displayEl.textContent = `🎁 ${t('pointsProgressMsg').replace('{count}', remaining)}`;
      displayEl.style.color = 'var(--stone)';
    }
  } catch (err) {
    console.error('Loyalty points check failed:', err);
    displayEl.textContent = '';
  }
}

async function submitOrder() {
  const submitBtn = document.getElementById('submitOrderBtn');
  if (submitBtn.disabled) return; // already submitting — ignore extra taps

  const errorEl = document.getElementById('orderError');
  const notes = document.getElementById('orderNotes').value.trim();
  const paymentMethod = document.getElementById('paymentMethod').value;

  let table = null, carNumber = null, carColor = null;
  let deliveryPhone = null, deliveryMapsLink = null, deliveryWilayat = null, deliveryArea = null, deliveryHouseNumber = null;

  if (selectedOrderType === 'car') {
    carNumber = document.getElementById('carNumber').value.trim();
    carColor = document.getElementById('carColor').value.trim();
    if (!carNumber || !carColor) {
      errorEl.textContent = t('carFieldsError');
      return;
    }
  } else if (selectedOrderType === 'delivery') {
    deliveryPhone = document.getElementById('deliveryPhoneInput').value.trim();
    deliveryMapsLink = document.getElementById('deliveryMapsLink').value.trim();
    deliveryWilayat = document.getElementById('deliveryWilayat').value.trim();
    deliveryArea = document.getElementById('deliveryArea').value.trim();
    deliveryHouseNumber = document.getElementById('deliveryHouseNumber').value.trim();
    if (!deliveryPhone || !deliveryMapsLink || !deliveryWilayat || !deliveryArea) {
      errorEl.textContent = t('deliveryFieldsError');
      return;
    }
  } else {
    table = document.getElementById('tableNum').value.trim();
  }

  if (paymentMethod === 'transfer' && !uploadedReceiptUrl) {
    errorEl.textContent = t('receiptRequiredError');
    return;
  }

  const loyaltyPhoneInput = document.getElementById('loyaltyPhoneInput');
  const loyaltyPhone = (loyaltyPhoneInput && loyaltyPhoneInput.value.trim()) ? loyaltyPhoneInput.value.trim() : null;

  const cartEntries = Object.entries(cart); // [itemId, {name, nameEn, price, qty}]
  const items = cartEntries.map(([, i]) => ({ name: i.name, nameEn: i.nameEn || null, price: i.price, qty: i.qty }));
  const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);
  const orderRef = db.collection('shops').doc(shopId).collection('orders').doc();

  submitBtn.disabled = true;
  submitBtn.textContent = t('sendingOrderLoading');
  errorEl.textContent = '';

  try {
    await db.runTransaction(async (tx) => {
      const menuRefs = cartEntries.map(([id]) => db.collection('shops').doc(shopId).collection('menu').doc(id));
      const menuDocs = await Promise.all(menuRefs.map(ref => tx.get(ref)));

      // Verify stock BEFORE writing anything — if any tracked item doesn't
      // have enough left, the whole order is rejected (nothing is decremented).
      for (let i = 0; i < cartEntries.length; i++) {
        const [, cartItem] = cartEntries[i];
        const menuData = menuDocs[i].exists ? menuDocs[i].data() : {};
        if (typeof menuData.stock === 'number' && menuData.stock < cartItem.qty) {
          const err = new Error('OUT_OF_STOCK');
          err.itemName = (currentLang === 'en' && menuData.nameEn) ? menuData.nameEn : cartItem.name;
          throw err;
        }
      }

      for (let i = 0; i < cartEntries.length; i++) {
        const [, cartItem] = cartEntries[i];
        const menuData = menuDocs[i].exists ? menuDocs[i].data() : {};
        if (typeof menuData.stock === 'number') {
          tx.update(menuRefs[i], { stock: menuData.stock - cartItem.qty });
        }
      }

      tx.set(orderRef, {
        orderType: selectedOrderType,
        tableNumber: table || null,
        carNumber: carNumber || null,
        carColor: carColor || null,
        deliveryPhone: deliveryPhone ? `+968 ${deliveryPhone}` : null,
        deliveryMapsLink: deliveryMapsLink || null,
        deliveryWilayat: deliveryWilayat || null,
        deliveryArea: deliveryArea || null,
        deliveryHouseNumber: deliveryHouseNumber || null,
        notes: notes || null,
        paymentMethod,
        receiptUrl: paymentMethod === 'transfer' ? uploadedReceiptUrl : null,
        loyaltyPhone,
        loyaltyRewardReady: loyaltyPhone ? currentLoyaltyRewardReady : false,
        items,
        total,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    });

    const docRef = orderRef;

    // Reset cart
    cart = {};
    updateCartBar();
    uploadedReceiptUrl = null;

    // Best-effort activity tracking for the admin panel — never allowed to
    // interfere with the order itself if it fails for any reason.
    db.collection('shops').doc(shopId).update({
      'info.lastOrderAt': firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => console.error('lastOrderAt update failed (non-blocking):', err));

    // Refresh the grid so any item that just hit zero stock shows as
    // unavailable immediately, without needing a full page reload.
    loadMenu();

    document.querySelectorAll('.grid-qty-container').forEach(el => {
      const itemId = el.id.replace('qtyctrl-', '');
      el.innerHTML = renderQtyControl(itemId, 0);
    });

    // Start live tracking of this order and show the step tracker
    trackOrder(docRef.id);

    const paymentInstructions = {
      cash: t('payCashInstruction'),
      card: t('payCardInstruction'),
      transfer: t('payTransferInstruction')
    };

    document.querySelector('.modal-sheet').innerHTML = `
      <h3 style="margin:8px 0 12px; text-align:center;">${t('orderSent')}</h3>
      <p style="text-align:center; color:var(--ink); font-weight:600; margin-bottom:20px;">${paymentInstructions[paymentMethod] || ''}</p>
      <div id="trackerContainer">${renderTracker('pending')}</div>
      <button class="btn" style="width:100%; margin-top:24px;" onclick="closeCartModal()">${t('close')}</button>
    `;
  } catch (err) {
    console.error(err);
    if (err.message === 'OUT_OF_STOCK') {
      errorEl.textContent = `${t('outOfStockError')}: ${err.itemName || ''}`;
      loadMenu();
    } else {
      errorEl.textContent = t('orderSendError');
    }
    submitBtn.disabled = false;
    submitBtn.textContent = t('sendOrder');
  }
}

// ---- Live order status tracking ----
const statusSteps = ['pending', 'preparing', 'ready'];

function getStatusStepLabel(status) {
  if (status === 'pending') return t('stepReceived');
  if (status === 'preparing') return t('stepPreparing');
  return t('stepReady');
}

function getStatusBarText(status) {
  if (status === 'pending') return t('barReceived');
  if (status === 'preparing') return t('barPreparing');
  return t('barReady');
}

let activeOrderId = null;
let activeOrderUnsub = null;

function trackOrder(orderId) {
  activeOrderId = orderId;
  if (activeOrderUnsub) activeOrderUnsub();

  localStorage.setItem(`activeOrder_${shopId}`, orderId);

  activeOrderUnsub = db.collection('shops').doc(shopId).collection('orders').doc(orderId)
    .onSnapshot(doc => {
      if (!doc.exists) {
        // Order was deleted — stop tracking and clean up
        clearOrderTracking();
        return;
      }
      const status = doc.data().status || 'pending';

      if (status === 'cancelled') {
        const bar = document.getElementById('orderStatusBar');
        bar.style.display = 'none';
        const trackerEl = document.getElementById('trackerContainer');
        if (trackerEl && !ratingInProgress) {
          trackerEl.innerHTML = `
            <div style="text-align:center; padding:10px 0;">
              <div style="font-size:2.2rem; margin-bottom:10px;">❌</div>
              <div style="font-weight:600; margin-bottom:18px;">${t('orderCancelledByShopMsg')}</div>
              <button class="btn" style="width:100%;" onclick="clearOrderTracking()">${t('close')}</button>
            </div>
          `;
        }
        return;
      }

      const bar = document.getElementById('orderStatusBar');
      bar.style.display = 'block';
      document.getElementById('statusBarText').textContent = getStatusBarText(status);
      bar.classList.toggle('status-bar-ready', status === 'ready');
      adjustStatusBarPosition();

      const trackerEl = document.getElementById('trackerContainer');
      if (trackerEl && !ratingInProgress) trackerEl.innerHTML = renderTracker(status);
    }, err => {
      console.error('Order tracking error:', err);
    });
}

// Called when the customer confirms they've received their order,
// or when the order no longer exists in Firestore.
function clearOrderTracking() {
  ratingInProgress = false;
  if (activeOrderUnsub) activeOrderUnsub();
  activeOrderUnsub = null;
  activeOrderId = null;
  localStorage.removeItem(`activeOrder_${shopId}`);
  document.getElementById('orderStatusBar').style.display = 'none';
  closeStatusModal();
  closeCartModal();
}

// Shown when the customer taps "Commande récupérée" — quick 1-5 star rating before
// the order tracker closes. Rating is optional; skipping still clears tracking.
let selectedRatingStars = 0;
let ratingInProgress = false;

function showRatingPrompt() {
  const container = document.getElementById('trackerContainer');
  if (!container) { clearOrderTracking(); return; }

  ratingInProgress = true;
  selectedRatingStars = 0;
  let starsHtml = '';
  for (let i = 1; i <= 5; i++) {
    starsHtml += `<span class="rating-star" data-star="${i}" onclick="selectRatingStar(${i})">☆</span>`;
  }

  container.innerHTML = `
    <div style="text-align:center; padding:10px 0;">
      <div style="margin-bottom:12px; font-weight:500;">${t('rateOrderPrompt')}</div>
      <div class="rating-stars">${starsHtml}</div>
      <button class="btn" id="submitRatingBtn" style="margin-top:18px; width:100%; opacity:0.5;" disabled onclick="submitRating()">${t('sendRatingBtn')}</button>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="clearOrderTracking()">${t('skipRating')}</button>
    </div>
  `;
}

function selectRatingStar(stars) {
  selectedRatingStars = stars;
  document.querySelectorAll('.rating-star').forEach((el, i) => {
    el.textContent = i < stars ? '★' : '☆';
  });
  const btn = document.getElementById('submitRatingBtn');
  btn.disabled = false;
  btn.style.opacity = '1';
}

async function submitRating() {
  if (!selectedRatingStars) return;
  const btn = document.getElementById('submitRatingBtn');
  if (btn) { btn.disabled = true; btn.textContent = t('sendingMsg'); }

  try {
    await db.collection('shops').doc(shopId).collection('orders').doc(activeOrderId).update({ rating: selectedRatingStars });
  } catch (err) {
    console.error('Rating submit failed:', err);
  }
  clearOrderTracking();
}

function renderTracker(status) {
  const stepIndex = statusSteps.indexOf(status);

  let barHtml = '<div class="timeline-bar">';
  statusSteps.forEach((s, i) => {
    const state = i < stepIndex ? 'done' : (i === stepIndex ? 'active' : '');
    barHtml += `<div class="timeline-segment ${state}"></div>`;
  });
  barHtml += '</div>';

  let labelsHtml = '<div class="timeline-labels">';
  statusSteps.forEach((s, i) => {
    const state = i < stepIndex ? 'done' : (i === stepIndex ? 'active' : '');
    labelsHtml += `<span class="${state}">${getStatusStepLabel(s)}</span>`;
  });
  labelsHtml += '</div>';

  let etaHtml = '';
  if (status !== 'ready' && shopInfo.estimatedMinutes) {
    etaHtml = `<div style="text-align:center; color:var(--stone); font-size:0.85rem; margin-top:14px;">⏱ ${t('etaText')}: ~${shopInfo.estimatedMinutes} ${t('minuteWord')}</div>`;
  }

  let doneBtnHtml = '';
  if (status === 'ready') {
    doneBtnHtml = `<button class="btn" style="width:100%; margin-top:20px;" onclick="showRatingPrompt()">${t('orderPickedUp')}</button>`;
  } else if (status === 'pending') {
    doneBtnHtml = `<button class="btn btn-ghost" style="width:100%; margin-top:20px; color:#B3441E;" onclick="cancelOrder()">${t('cancelOrderBtn')}</button>`;
  }

  return `<div class="order-track">${barHtml}${labelsHtml}${etaHtml}${doneBtnHtml}</div>`;
}

async function cancelOrder() {
  if (!activeOrderId) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'cancelConfirmOverlay';
  overlay.innerHTML = `
    <div class="modal-sheet" style="text-align:center;">
      <div style="font-size:2.5rem; margin-bottom:10px;">❌</div>
      <h3 style="margin-bottom:20px;">${t('confirmCancelOrder')}</h3>
      <div style="display:flex; gap:10px;">
        <button class="btn" style="flex:1; background:#B3441E;" id="confirmCancelYesBtn">${t('yesCancelBtn')}</button>
        <button class="btn btn-ghost" style="flex:1;" id="confirmCancelNoBtn">${t('noKeepBtn')}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('confirmCancelNoBtn').addEventListener('click', () => overlay.remove());
  document.getElementById('confirmCancelYesBtn').addEventListener('click', async () => {
    overlay.remove();
    try {
      await db.collection('shops').doc(shopId).collection('orders').doc(activeOrderId).update({ status: 'cancelled' });
      clearOrderTracking();
    } catch (err) {
      console.error('Cancel order failed:', err);
      alert(t('cancelOrderFailed'));
    }
  });
}

function openStatusModal() {
  if (!activeOrderId) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'statusOverlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="close-x" onclick="closeStatusModal()">×</button>
      <h3 style="margin:8px 0 20px; text-align:center;">${t('yourOrderStatus')}</h3>
      <div id="trackerContainer">${renderTracker(statusSteps[0])}</div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Immediately refresh with the real current status
  db.collection('shops').doc(shopId).collection('orders').doc(activeOrderId).get().then(doc => {
    if (doc.exists) {
      document.getElementById('trackerContainer').innerHTML = renderTracker(doc.data().status || 'pending');
    }
  });
}

function closeStatusModal() {
  const overlay = document.getElementById('statusOverlay');
  if (overlay) overlay.remove();
}

applyLangDirection();
loadMenu();
</script>
